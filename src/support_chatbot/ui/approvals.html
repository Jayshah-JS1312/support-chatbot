<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ami · Approval inbox</title>
<style>
:root{color-scheme:dark;--bg:#080c12;--panel:#101722;--raised:#151e2b;--line:#29364a;--text:#eef3fa;--muted:#9eabc0;--accent:#ffad1f;--green:#42d6a4;--red:#ff727f;--blue:#6ca7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,textarea,select{font:inherit}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;background:rgba(8,12,18,.96);z-index:5}.brand{font-size:18px;font-weight:800;color:var(--accent)}.sub{color:var(--muted)}.nav{margin-left:auto;display:flex;gap:8px}.nav a,.btn{color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 13px;text-decoration:none;cursor:pointer}.btn:hover,.nav a:hover{border-color:#52627a}.btn:focus-visible,.nav a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(108,167,255,.45);outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);min-height:calc(100vh - 64px)}.queue{border-right:1px solid var(--line);padding:22px;overflow:auto}.detail{padding:28px;overflow:auto}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}.tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 11px;cursor:pointer}.tab.active{color:#111827;background:var(--accent);border-color:var(--accent);font-weight:800}.card{width:100%;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:15px;margin:0 0 10px;cursor:pointer}.card:hover,.card.active{border-color:var(--accent);background:var(--raised)}.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.ref{font-weight:800}.meta,.empty{color:var(--muted)}.badge{font-size:11px;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:3px 7px}.badge.pending{color:var(--accent)}.badge.approved{color:var(--green)}.badge.rejected,.badge.expired,.badge.overdue{color:var(--red)}h1{font-size:26px;margin:4px 0 4px}h2{font-size:16px;margin:0 0 11px}.summary{color:var(--muted);margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:14px}.section.full{grid-column:1/-1}.fact{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid rgba(41,54,74,.55)}.fact:last-child{border:0}.label{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:#cbd7e8}.conversation{display:grid;gap:8px}.message{padding:10px 12px;border-radius:9px;background:var(--raised)}.message.user{border-left:3px solid var(--accent)}.message.assistant{border-left:3px solid var(--blue)}textarea{width:100%;min-height:130px;resize:vertical;color:var(--text);background:#0b111a;border:1px solid var(--line);border-radius:9px;padding:12px}.question{padding:14px;border:1px solid var(--line);border-radius:10px;margin:14px 0}.question label{display:block;margin:7px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.approve{background:var(--green);color:#05261c;border-color:var(--green);font-weight:800}.reject{background:transparent;color:var(--red);border-color:#693842}.status{min-height:22px;color:var(--muted);margin-top:10px}.audit{margin:0;padding-left:20px}.audit li{margin:8px 0}.deadline.overdue{color:var(--red)}@media(max-width:850px){.layout{grid-template-columns:1fr}.queue{border-right:0;border-bottom:1px solid var(--line);max-height:48vh}.detail{padding:20px}.grid{grid-template-columns:1fr}.section.full{grid-column:auto}.top{padding:0 14px}.sub{display:none}.nav a:not(:last-child){display:none}}@media(prefers-reduced-motion:no-preference){.card,.btn,.tab{transition:border-color .15s,background .15s}}
.nav button{color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer}.nav button:hover{border-color:#52627a}.nav button:focus-visible{outline:3px solid rgba(108,167,255,.45);outline-offset:2px}
</style></head><body><header class="top"><div class="brand">Ami Operations</div><div class="sub">human approval inbox</div><nav class="nav"><a href="/monitoring">Observability</a><a href="/evals">Evals</a><button type="button" onclick="logout()">Logout</button></nav></header><main class="layout"><aside class="queue"><div class="eyebrow">Review queue</div><div class="tabs" id="tabs"></div><div id="queue" aria-live="polite"><p class="empty">Loading approvals…</p></div></aside><section class="detail" id="detail"><div class="empty"><h1>Select an approval</h1><p>Review the submitted request, verified facts, evidence, consequences, and exact action before deciding.</p></div></section></main>
<script>
const filters=['pending','overdue','approved','rejected','expired'],esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active='pending',selected=null,reviewers=[];
async function logout(){try{await fetch('/auth/logout?role=admin',{method:'POST'})}finally{location.href='/login?role=admin'}}
function tabs(){document.getElementById('tabs').innerHTML=filters.map(f=>`<button class="tab ${f===active?'active':''}" data-filter="${f}">${f}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.filter;selected=null;loadQueue()})}
function age(seconds){seconds=Number(seconds||0);if(seconds<60)return 'just now';if(seconds<3600)return `${Math.floor(seconds/60)}m`;if(seconds<86400)return `${Math.floor(seconds/3600)}h`;return `${Math.floor(seconds/86400)}d`}
async function loadQueue(){tabs();const response=await fetch(`/admin/approvals.json?status=${active}`,{cache:'no-store'});if(!response.ok){document.getElementById('queue').innerHTML='<p class="empty">Could not load the approval queue.</p>';return}const data=await response.json();reviewers=data.reviewers||[];document.getElementById('queue').innerHTML=data.items.length?data.items.map(item=>`<button class="card ${item.request_id===selected?'active':''}" data-id="${esc(item.request_id)}"><div class="row"><span class="ref">${esc(item.reference_number)}</span><span class="badge ${active}">${esc(active)}</span></div><p>${esc(item.customer_request)}</p><div class="row meta"><span>${esc(item.customer_name||item.customer_email||'Customer')}</span><span>${age(item.age_seconds)}</span></div></button>`).join(''):'<p class="empty">No approvals in this view.</p>';document.querySelectorAll('.card').forEach(card=>card.onclick=()=>loadDetail(card.dataset.id))}
function facts(data){return [['Order',data.order_number],['Item',data.item_name],['Price',data.price==null?null:`$${Number(data.price).toFixed(2)}`],['Current status',data.order_status],['Current version',data.current_order_version],['Proposed version',data.order_version]].filter(x=>x[1]!=null).map(x=>`<div class="fact"><span class="label">${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')||'<p class="empty">No order is attached to this request.</p>'}
function audit(data){return (data.audit_history||[]).map(e=>`<li><strong>${esc(e.event_type.replaceAll('_',' '))}</strong> · ${esc(new Date(e.created_at).toLocaleString())}<br><span class="meta">${esc(JSON.stringify(e.detail||{}))}</span></li>`).join('')||'<li class="empty">No decisions recorded yet.</li>'}
async function loadDetail(id){selected=id;loadQueue();const response=await fetch(`/admin/approvals/${id}.json`,{cache:'no-store'});if(!response.ok)return;const d=await response.json(),pending=d.approval_status==='pending',deadline=new Date(d.expires_at),overdue=pending&&d.queue_name==='supervisor';document.getElementById('detail').innerHTML=`<div class="eyebrow">${esc(d.reference_number)} · ${esc(d.queue_name||'review')} queue</div><h1>${esc(d.customer_name||d.customer_email)}</h1><div class="summary">Submitted ${esc(new Date(d.request_created_at).toLocaleString())} · Reminder ${esc(new Date(d.reminder_at).toLocaleString())} · Escalation ${esc(new Date(d.escalation_at).toLocaleString())} · <span class="deadline ${overdue?'overdue':''}">Final expiry ${esc(deadline.toLocaleString())}</span></div><div class="grid"><div class="section"><h2>Submitted customer request</h2><p>${esc(d.customer_request)}</p></div><div class="section"><h2>Verified order facts</h2>${facts(d)}</div><div class="section"><h2>Policy evidence</h2><pre>${esc(JSON.stringify(d.policy_evidence||{},null,2))}</pre></div><div class="section"><h2>Exact proposed action</h2><pre>${esc(JSON.stringify({action:d.action_name||d.proposed_action?.type||'send_resolution',arguments:d.action_arguments||d.proposed_action?.arguments||{},consequences:d.customer_consequences||{}},null,2))}</pre></div><div class="section full"><h2>Proposed customer response</h2><textarea id="response" ${pending?'':'disabled'}>${esc(d.proposed_response||'')}</textarea>${pending?`<div class="question"><strong>Was human review genuinely necessary?</strong><label><input type="radio" name="necessary" value="true"> Yes</label><label><input type="radio" name="necessary" value="false"> No</label></div><label class="label" for="reason">Reviewer note</label><textarea id="reason" style="min-height:76px" placeholder="Why are you approving, editing, or rejecting?"></textarea><div class="actions"><button class="btn approve" onclick="decide(true)">Approve response</button><button class="btn reject" onclick="decide(false)">Reject</button><select id="assignee" aria-label="Reassign to">${reviewers.map(r=>`<option value="${esc(r.id)}">${esc(r.display_name)} · ${esc(r.email)}</option>`).join('')}</select><button class="btn" onclick="reassign()">Reassign</button></div><div class="status" id="status" aria-live="polite"></div>`:`<p class="meta">Decision: ${esc(d.approval_status)}${d.reviewer_name?` by ${esc(d.reviewer_name)}`:''}. Human review necessary: ${d.review_necessary==null?'not recorded':d.review_necessary?'yes':'no'}.</p>`}</div><div class="section full"><h2>Audit history</h2><ol class="audit">${audit(d)}</ol></div></div>`}
async function decide(approve){const choice=document.querySelector('input[name=necessary]:checked'),status=document.getElementById('status');if(!choice){status.textContent='Answer whether human review was genuinely necessary.';return}status.textContent='Saving decision…';const response=await fetch(`/admin/requests/${selected}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:approve?'approve':'reject',reason:document.getElementById('reason').value,edited_response:document.getElementById('response').value,review_necessary:choice.value==='true'})});const data=await response.json();if(!response.ok){status.textContent=data.error?.message||'Decision failed.';return}await loadQueue();await loadDetail(selected)}
async function reassign(){const status=document.getElementById('status'),admin_user_id=document.getElementById('assignee').value;if(!admin_user_id){status.textContent='No administrator is available.';return}const response=await fetch(`/admin/requests/${selected}/reassign`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_user_id,reason:document.getElementById('reason').value})});status.textContent=response.ok?'Reassigned successfully.':'Reassignment failed.';if(response.ok)loadDetail(selected)}
loadQueue();
</script></body></html>
