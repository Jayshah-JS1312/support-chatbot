<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support tickets · Ami</title>
  <style>
    :root{color-scheme:dark;--bg:#080c12;--panel:#111925;--raised:#162131;--line:#29384d;--text:#edf3fc;--muted:#9cabc0;--accent:#ffad1f;--green:#50dda8;--blue:#8ebcff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}header{min-height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 28px;position:sticky;top:0;background:rgba(8,12,18,.96)}header b{color:var(--accent);font-size:20px}nav{display:flex;gap:10px}button,a{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid rgba(255,173,31,.35);outline-offset:2px}main{max-width:980px;margin:0 auto;padding:38px 24px}h1{margin:0 0 6px;font-size:30px}.intro{color:var(--muted);margin:0 0 26px}.list{display:grid;gap:14px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.ticket-head{display:flex;justify-content:space-between;gap:16px}.ref{font-weight:750}.status{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em}.status.open{color:var(--accent)}.status.in_progress{color:var(--blue)}.status.resolved{color:var(--green)}.status.closed{color:var(--muted)}.summary{margin:14px 0}.meta,.empty,.status-explanation{color:var(--muted)}.status-explanation{margin-top:4px}.resolution{background:var(--raised);border-left:3px solid var(--green);padding:13px;margin-top:14px;white-space:pre-wrap}.refresh{font-size:12px;color:var(--muted);margin-top:20px}@media(max-width:600px){header{padding:12px 14px;align-items:flex-start;flex-direction:column}main{padding:24px 14px}.ticket-head{display:block}.status{display:block;margin-top:5px}}
  </style>
</head>
<body>
<header><b>Ami Support</b><nav><a href="/">← Back to chat</a><button onclick="logout()">Logout</button></nav></header>
<main><h1>Your support tickets</h1><p class="intro">Human-support requests and their latest status. This page updates automatically.</p><div id="tickets" class="list" aria-live="polite"><div class="empty">Loading tickets…</div></div><p class="refresh" id="refreshStatus"></p></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const explanations={open:'Waiting for a support specialist to start reviewing this request.',in_progress:'A support specialist is currently working on this request.',resolved:'A support specialist has responded. Review the outcome below.',closed:'This support request is complete and no further work is pending.'};
let snapshot='';
async function load(){const response=await fetch('/tickets.json',{cache:'no-store'});if(!response.ok){location.href='/login?role=customer';return}const data=await response.json(),next=JSON.stringify(data.items),box=document.getElementById('tickets');if(next!==snapshot){box.innerHTML=data.items.length?data.items.map(ticket=>`<article class="ticket"><div class="ticket-head"><span class="ref">${esc(ticket.reference_number)}</span><span class="status ${esc(ticket.status)}">${esc(ticket.status.replace('_',' '))}</span></div><div class="status-explanation">${esc(explanations[ticket.status]||'Status updated.')}</div><div class="summary">${esc(ticket.summary)}</div><div class="meta">Created ${new Date(ticket.created_at).toLocaleString()}</div>${ticket.resolution&&['resolved','closed'].includes(ticket.status)?`<div class="resolution"><strong>Response from support</strong><br>${esc(ticket.resolution)}</div>`:''}</article>`).join(''):'<div class="empty">You have no human-support tickets.</div>';snapshot=next}document.getElementById('refreshStatus').textContent=`Last checked ${new Date().toLocaleTimeString()}`}
async function logout(){try{await fetch('/auth/logout?role=customer',{method:'POST'})}finally{location.href='/login?role=customer'}}
load();setInterval(load,5000);
</script>
</body>
</html>
