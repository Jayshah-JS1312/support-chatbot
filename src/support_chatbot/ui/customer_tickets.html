<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support tickets · Ami</title><style>
:root{color-scheme:dark;--bg:#080c12;--panel:#111925;--line:#29384d;--text:#edf3fc;--muted:#9cabc0;--accent:#ffad1f;--green:#50dda8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}header b{color:var(--accent);font-size:20px}nav{display:flex;gap:10px}button,a{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}main{max-width:980px;margin:0 auto;padding:38px 24px}h1{margin:0 0 6px;font-size:30px}.intro{color:var(--muted);margin:0 0 26px}.list{display:grid;gap:14px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.ticket-head{display:flex;justify-content:space-between;gap:16px}.ref{font-weight:750}.status{text-transform:capitalize;color:var(--green)}.summary{margin:14px 0}.meta,.resolution,.empty{color:var(--muted)}.resolution{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}@media(max-width:600px){header{padding:0 14px}main{padding:24px 14px}.ticket-head{display:block}}
</style></head><body><header><b>Ami Support</b><nav><a href="/">← Back to chat</a><button onclick="logout()">Logout</button></nav></header><main><h1>Your support tickets</h1><p class="intro">Human-support requests and their latest status. This page updates automatically.</p><div id="tickets" class="list" aria-live="polite"><div class="empty">Loading tickets…</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/tickets.json',{cache:'no-store'});if(!r.ok){location.href='/login?role=customer';return}const d=await r.json(),box=document.getElementById('tickets');box.innerHTML=d.items.length?d.items.map(t=>`<article class="ticket"><div class="ticket-head"><span class="ref">${esc(t.reference_number)}</span><span class="status">${esc(t.status.replace('_',' '))}</span></div><div class="summary">${esc(t.summary)}</div><div class="meta">Created ${new Date(t.created_at).toLocaleString()}</div>${t.resolution?`<div class="resolution"><b>Support response</b><br>${esc(t.resolution)}</div>`:''}</article>`).join(''):'<div class="empty">You have no human-support tickets.</div>'}async function logout(){try{await fetch('/auth/logout?role=customer',{method:'POST'})}finally{location.href='/login?role=customer'}}load();setInterval(load,5000);
</script></body></html>
