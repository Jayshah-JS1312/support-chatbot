<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support tickets · Ami Operations</title>
  <style>
    :root{color-scheme:dark;--bg:#080c12;--panel:#111925;--raised:#162131;--line:#29384d;--text:#edf3fc;--muted:#9cabc0;--accent:#ffad1f;--green:#50dda8;--red:#ff7b86}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,textarea{font:inherit}
    header{min-height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 24px;position:sticky;top:0;z-index:5;background:rgba(8,12,18,.96)}
    header b{color:var(--accent);font-size:20px}nav,.filters,.actions{display:flex;gap:9px;flex-wrap:wrap}button,a{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px;text-decoration:none;cursor:pointer}button:hover,a:hover{border-color:#52647f}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,173,31,.35);outline-offset:2px}button:disabled{opacity:.55;cursor:wait}
    button.active,button.primary{background:var(--accent);color:#241500;border-color:var(--accent);font-weight:750}main{max-width:1120px;margin:auto;padding:32px 22px}h1{margin:0 0 5px}.intro,.meta,.empty,.help{color:var(--muted)}.filters{margin:24px 0}.list{display:grid;gap:14px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.head{display:flex;justify-content:space-between;gap:18px}.ref{font-weight:800}.status{text-transform:capitalize}.status.open{color:var(--accent)}.status.in_progress{color:#8ebcff}.status.resolved{color:var(--green)}.status.closed{color:var(--muted)}.summary{margin:12px 0}.editor{margin-top:16px}.editor label{display:block;font-weight:750;margin-bottom:3px}.help{font-size:12px;margin:0 0 8px}textarea{width:100%;min-height:104px;resize:vertical;background:#0b111a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.actions{margin-top:12px}.customer-response{margin-top:14px;padding:13px;border-left:3px solid var(--green);background:var(--raised);white-space:pre-wrap}.result{min-height:22px;margin-top:9px;color:var(--muted)}.result.error{color:var(--red)}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.head{display:block}.status{display:block;margin-top:5px}main{padding:24px 14px}}
  </style>
</head>
<body>
<header><b>Ami Operations · Support tickets</b><nav><a href="/admin/approvals">Approvals</a><a href="/monitoring">Observability</a><a href="/evals">Evals</a><button onclick="logout()">Logout</button></nav></header>
<main>
  <h1>Human-support queue</h1>
  <p class="intro">Customer-requested handoffs. This is separate from privileged-action approvals.</p>
  <div class="filters" id="filters"></div>
  <div class="list" id="tickets" aria-live="polite"></div>
</main>
<script>
const statuses=['open','in_progress','resolved','closed','all'];
let selected='open',loading=false,lastSnapshot='';
const drafts=new Map(),ticketCache=new Map(),busy=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawFilters(){document.getElementById('filters').innerHTML=statuses.map(s=>`<button class="${s===selected?'active':''}" onclick="choose('${s}')">${s.replace('_',' ')}</button>`).join('')}
async function choose(status){selected=status;lastSnapshot='';drawFilters();await load({force:true})}
function captureDrafts(){document.querySelectorAll('textarea[data-ticket]').forEach(field=>drafts.set(field.dataset.ticket,field.value))}
function editing(){return document.activeElement?.matches('textarea[data-ticket]')}
function ticketActions(ticket){
  if(ticket.status==='closed')return '';
  if(ticket.status==='resolved')return `<button onclick="updateTicket('${ticket.id}','closed')">Close ticket</button>`;
  const start=ticket.status==='open'?`<button onclick="updateTicket('${ticket.id}','in_progress')">Start work</button>`:'';
  return `${start}<button class="primary" onclick="updateTicket('${ticket.id}','resolved')">Send response & resolve</button>`;
}
function ticketEditor(ticket){
  if(['resolved','closed'].includes(ticket.status))return ticket.resolution?`<div class="customer-response"><strong>Response sent to customer</strong><br>${esc(ticket.resolution)}</div>`:'';
  const value=drafts.has(ticket.id)?drafts.get(ticket.id):(ticket.resolution||'');
  return `<div class="editor"><label for="resolution-${ticket.id}">Response visible to customer</label><p class="help">Required to resolve. Draft text stays private until you select “Send response & resolve.”</p><textarea id="resolution-${ticket.id}" data-ticket="${ticket.id}" maxlength="4000" placeholder="Explain the outcome and next steps clearly.">${esc(value)}</textarea></div>`;
}
function render(items){
  const box=document.getElementById('tickets');ticketCache.clear();items.forEach(item=>ticketCache.set(item.id,item));
  box.innerHTML=items.length?items.map(t=>`<article class="ticket"><div class="head"><span><span class="ref">${esc(t.reference_number)}</span> · ${esc(t.customer_name)} (${esc(t.customer_email)})</span><span class="status ${esc(t.status)}">${esc(t.status.replace('_',' '))}</span></div><div class="summary">${esc(t.summary)}</div><div class="meta">Created ${new Date(t.created_at).toLocaleString()}${t.assignee_name?` · Assigned to ${esc(t.assignee_name)}`:''}</div>${ticketEditor(t)}<div class="actions">${ticketActions(t)}</div><div class="result" id="result-${t.id}" aria-live="polite"></div></article>`).join(''):'<div class="empty">No tickets in this view.</div>';
}
async function load({force=false}={}){
  if(loading||(!force&&editing()))return;loading=true;
  try{const response=await fetch(`/admin/tickets.json?status=${selected}`,{cache:'no-store'});if(!response.ok){location.href='/login?role=admin';return}const data=await response.json(),snapshot=JSON.stringify(data.items);if(!force&&editing())return;if(force||snapshot!==lastSnapshot){captureDrafts();render(data.items);lastSnapshot=snapshot}}
  finally{loading=false}
}
async function updateTicket(id,status){
  if(busy.has(id))return;captureDrafts();const ticket=ticketCache.get(id),resolution=status==='closed'?(ticket?.resolution||''):(drafts.get(id)||'').trim(),result=document.getElementById(`result-${id}`);
  if(status==='resolved'&&!resolution){result.textContent='Write the customer response before resolving this ticket.';result.classList.add('error');document.getElementById(`resolution-${id}`)?.focus();return}
  busy.add(id);document.querySelectorAll(`button[onclick*="'${id}'"]`).forEach(button=>button.disabled=true);result.classList.remove('error');result.textContent='Saving…';
  try{const response=await fetch(`/admin/tickets/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,resolution})});const data=await response.json().catch(()=>({}));if(!response.ok){result.textContent=data.error?.message||data.detail||'Ticket could not be updated.';result.classList.add('error');return}if(status==='resolved'||status==='closed')drafts.delete(id);lastSnapshot='';await load({force:true})}
  finally{busy.delete(id)}
}
async function logout(){try{await fetch('/auth/logout?role=admin',{method:'POST'})}finally{location.href='/login?role=admin'}}
document.addEventListener('input',event=>{if(event.target.matches('textarea[data-ticket]'))drafts.set(event.target.dataset.ticket,event.target.value)});
drawFilters();load({force:true});setInterval(()=>load(),5000);
</script>
</body>
</html>
