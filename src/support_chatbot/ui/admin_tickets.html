<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support tickets · Ami Operations</title><style>
:root{color-scheme:dark;--bg:#080c12;--panel:#111925;--line:#29384d;--text:#edf3fc;--muted:#9cabc0;--accent:#ffad1f;--green:#50dda8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}header b{color:var(--accent);font-size:20px}nav,.filters,.actions{display:flex;gap:9px;flex-wrap:wrap}button,a{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px;text-decoration:none;cursor:pointer}button.active,button.primary{background:var(--accent);color:#241500;border-color:var(--accent);font-weight:750}main{max-width:1120px;margin:auto;padding:32px 22px}h1{margin:0 0 5px}.intro,.meta,.empty{color:var(--muted)}.filters{margin:24px 0}.list{display:grid;gap:14px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.head{display:flex;justify-content:space-between;gap:18px}.ref{font-weight:800}.status{color:var(--green);text-transform:capitalize}.summary{margin:12px 0}.actions{margin-top:15px}textarea{width:100%;min-height:70px;background:#0b111a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:12px} @media(max-width:700px){header{height:auto;padding:14px;align-items:flex-start}.head{display:block}}
</style></head><body><header><b>Ami Operations · Support tickets</b><nav><a href="/admin/approvals">Approvals</a><a href="/monitoring">Observability</a><a href="/evals">Evals</a><button onclick="logout()">Logout</button></nav></header><main><h1>Human-support queue</h1><p class="intro">Customer-requested handoffs. This is separate from privileged-action approvals.</p><div class="filters" id="filters"></div><div class="list" id="tickets" aria-live="polite"></div></main><script>
const statuses=['open','in_progress','resolved','closed','all'];let selected='open';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawFilters(){document.getElementById('filters').innerHTML=statuses.map(s=>`<button class="${s===selected?'active':''}" onclick="choose('${s}')">${s.replace('_',' ')}</button>`).join('')}async function choose(s){selected=s;drawFilters();await load()}async function load(){const r=await fetch(`/admin/tickets.json?status=${selected}`,{cache:'no-store'});if(!r.ok){location.href='/login?role=admin';return}const d=await r.json(),box=document.getElementById('tickets');box.innerHTML=d.items.length?d.items.map(t=>`<article class="ticket"><div class="head"><span><span class="ref">${esc(t.reference_number)}</span> · ${esc(t.customer_name)} (${esc(t.customer_email)})</span><span class="status">${esc(t.status.replace('_',' '))}</span></div><div class="summary">${esc(t.summary)}</div><div class="meta">Created ${new Date(t.created_at).toLocaleString()}${t.assignee_name?` · Assigned to ${esc(t.assignee_name)}`:''}</div><textarea id="resolution-${t.id}" placeholder="Resolution or internal decision note">${esc(t.resolution||'')}</textarea><div class="actions">${t.status==='open'?`<button onclick="update('${t.id}','in_progress')">Start work</button>`:''}${!['resolved','closed'].includes(t.status)?`<button class="primary" onclick="update('${t.id}','resolved')">Resolve ticket</button>`:''}${t.status!=='closed'?`<button onclick="update('${t.id}','closed')">Close</button>`:''}</div></article>`).join(''):'<div class="empty">No tickets in this view.</div>'}async function update(id,status){const resolution=document.getElementById(`resolution-${id}`).value;const r=await fetch(`/admin/tickets/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,resolution})});if(!r.ok){alert('Ticket could not be updated.');return}await load()}async function logout(){try{await fetch('/auth/logout?role=admin',{method:'POST'})}finally{location.href='/login?role=admin'}}drawFilters();load();setInterval(load,5000);
</script></body></html>
