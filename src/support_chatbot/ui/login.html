<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Sign in · Ami Support</title>
<style>:root{--bg:#080c12;--card:#111824;--line:#2a384d;--text:#f3f6fb;--muted:#9baabd;--accent:#ffb020;--danger:#ff7373}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1b2230,var(--bg) 45%);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}main{width:min(440px,100%);padding:30px;border:1px solid var(--line);border-radius:20px;background:rgba(17,24,36,.96);box-shadow:0 28px 80px #0008}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--accent);color:#1d1305;font-size:20px;font-weight:800}h1{margin:0;font-size:24px}.sub{color:var(--muted);margin:4px 0 22px}label{display:block;margin:13px 0 6px;color:#cad4e2;font-weight:600}input{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#0b111a;color:var(--text);font:inherit}input:focus{outline:3px solid #ffb02033;border-color:var(--accent)}button{width:100%;height:46px;margin-top:18px;border:0;border-radius:11px;background:var(--accent);color:#1d1305;font:700 14px system-ui;cursor:pointer}.switch{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:10px}.error{min-height:22px;margin-top:12px;color:var(--danger)}.demo{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.demo b{color:var(--text)}code{color:#ffd178}#nameRow{display:none}</style></head>
<body><main><div class="brand"><div class="mark">A</div><div><h1 id="title">Welcome back</h1><div class="sub" id="subtitle">Sign in to your customer-support workspace.</div></div></div><form id="form"><div id="nameRow"><label for="name">Name</label><input id="name" maxlength="100" autocomplete="name"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" required minlength="12" autocomplete="current-password"><button id="submit">Sign in</button></form><button class="switch" id="switch" type="button">Create an account</button><div class="error" id="error" role="alert"></div><div class="demo"><b>Demo accounts</b><br>Customer: <code>raj@example.com</code> / <code>RajDemo!2026</code><br>Admin: <code>admin@example.com</code> / <code>AdminDemo!2026</code></div></main>
<script>let signup=false;const $=id=>document.getElementById(id);$('switch').onclick=()=>{signup=!signup;$('nameRow').style.display=signup?'block':'none';$('title').textContent=signup?'Create your account':'Welcome back';$('subtitle').textContent=signup?'New accounts always receive the customer role.':'Sign in to your customer-support workspace.';$('submit').textContent=signup?'Create account':'Sign in';$('switch').textContent=signup?'Already have an account? Sign in':'Create an account';$('password').autocomplete=signup?'new-password':'current-password';$('error').textContent=''};$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const body={email:$('email').value,password:$('password').value};if(signup)body.display_name=$('name').value;const response=await fetch(signup?'/auth/signup':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(response.ok){location.href=data.user?.role==='admin'?'/admin/approvals':'/';return}$('error').textContent=data.error?.message||'Could not sign in.'};</script></body></html>
