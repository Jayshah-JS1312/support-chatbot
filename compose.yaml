name: customer-support-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_chatbot
      POSTGRES_USER: support_chatbot
      POSTGRES_PASSWORD: support_chatbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_chatbot -d support_chatbot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - support-chatbot-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  migrate:
    build: .
    command: ["support-chatbot-migrate"]
    environment:
      DATABASE_URL: postgresql://support_chatbot:support_chatbot@postgres:5432/support_chatbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Local Docker exposes the monitoring console. Set to false before
      # deploying publicly unless the route sits behind authentication.
      SUPPORT_CHATBOT_EXPOSE_INTERNAL_UI: "true"
      SUPPORT_CHATBOT_SECURE_COOKIES: "false"
      # Accelerated Phase 7 demonstration: remind 60s, escalate 120s, expire 300s.
      SUPPORT_CHATBOT_ABSENCE_DEMO_MODE: "true"
      SUPPORT_CHATBOT_LOCAL_WORKFLOW_WORKERS: "4"
      SUPPORT_CHATBOT_LOCAL_WORKFLOW_QUEUE_MAX: "2000"
      SUPPORT_CHATBOT_WORKFLOW_RECOVERY_SCAN_SECONDS: "5"
      SUPPORT_CHATBOT_MODEL_MAX_CONCURRENCY: "4"
      SUPPORT_CHATBOT_DB_POOL_MAX: "10"
      DATABASE_URL: postgresql://support_chatbot:support_chatbot@postgres:5432/support_chatbot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - support-chatbot-cache:/data/cache
    restart: unless-stopped

  synthetic-seed:
    profiles: ["seed"]
    build: .
    command: ["support-chatbot-seed-synthetic", "--confirm", "SYNTHETIC_DATA_ONLY"]
    environment:
      SUPPORT_CHATBOT_ENVIRONMENT: development
      SUPPORT_CHATBOT_ENABLE_SYNTHETIC_SEED: "true"
      SUPPORT_CHATBOT_SYNTHETIC_SEED_DATABASE: support_chatbot
      DATABASE_URL: postgresql://support_chatbot:support_chatbot@postgres:5432/support_chatbot
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  support-chatbot-postgres:
  support-chatbot-cache:
